name: vault-snapshot-agent

# HashiCorp Vault Agent: authenticates with AppRole and proxies API calls with the
# auto-auth token, so backup.sh needs no token. Published on localhost only.
services:
  snapshot-agent:
    image: ${VAULT_IMAGE:-hashicorp/vault:latest}
    container_name: vault-snap-agent
    command: ["vault", "agent", "-config=/etc/vault.d/vault_snapshot_agent.hcl"]
    user: "${SNAP_UID:-1000}:${SNAP_GID:-1000}"
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./config:/etc/vault.d:ro
    networks:
      - vault-net

networks:
  vault-net:
    external: true
